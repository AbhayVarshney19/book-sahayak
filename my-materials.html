<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Materials - Book Sahayak</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="my-materials-review.css">
</head>

<body class="my-materials-page">

    <header class="my-materials-header">

        <button
            type="button"
            class="my-materials-back"
            id="backBtn"
            aria-label="Back to Home"
        >
            ←
        </button>

        <div class="my-materials-brand">
            <span>📚</span>
            <strong>Book Sahayak</strong>
        </div>

        <button
            type="button"
            id="myMaterialsThemeBtn"
            class="my-materials-theme"
            aria-label="Toggle dark mode"
        >
            🌙
        </button>

    </header>


    <main class="my-materials-main">

        <section class="my-materials-intro">

            <p class="my-materials-eyebrow">
                YOUR COLLECTION
            </p>

            <h1>My Materials</h1>

            <p>
                Manage the books, notes, PYQs and study resources
                you have shared with other students.
            </p>

        </section>


        <section class="my-materials-content">

            <div class="my-materials-heading">

                <div>
                    <p class="small-heading">
                        YOUR UPLOADS
                    </p>

                    <h2>Your shared materials</h2>
                </div>

                <span
                    id="myMaterialsCount"
                    class="my-materials-count"
                >
                    0 materials
                </span>

            </div>


            <div id="myMaterialsList">

                <div class="my-materials-loading">
                    <div class="my-materials-loading-icon">
                        📚
                    </div>

                    <p>Loading your materials...</p>
                </div>

            </div>

        </section>


        <button
            type="button"
            class="my-materials-home-btn"
            onclick="window.location.href='home.html'"
        >
            ← Back to Home
        </button>

    </main>


    <script
        type="module"
        src="my-materials.js"
    ></script>

</body>

</html>
